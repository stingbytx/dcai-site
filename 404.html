<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>404 — Page Not Found | dotcomAI</title>
<link rel="canonical" href="https://dotcomai.site/404.html" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#000;--bg-1:#050505;--green:#22c55e;--text:#fff;--text-2:#A1A1AA;--muted:#71717A;--border:rgba(255,255,255,.08)}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .wrap{position:relative;text-align:center;padding:40px 24px;width:100%;max-width:640px}
  .code{font-size:clamp(90px,20vw,180px);font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#1f1f1f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-.04em}
  h1{font-size:clamp(24px,5vw,34px);font-weight:800;margin:18px 0 12px;letter-spacing:-.02em}
  p{color:var(--text-2);font-size:17px;line-height:1.6;max-width:460px;margin:0 auto 36px}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#000;text-decoration:none;font-weight:700;font-size:15px;padding:14px 26px;border-radius:12px;transition:transform .3s ease,box-shadow .3s ease}
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(34,197,94,.35)}
  .arrow{font-size:18px}
  .muted{margin-top:34px;font-size:13px;color:var(--muted)}
  .muted a{color:var(--text-2);text-decoration:none}
  .muted a:hover{color:var(--green)}
  .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 20%,rgba(34,197,94,.08),transparent 60%)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="wrap">
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist, was moved, or the link is broken.</p>
  <a class="btn" href="/">Back to Home <span class="arrow">→</span></a>
</div>
</body>
</html>
